<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html{
            font-size: 62.5%;
        }
        body{
            font-size: 1.0rem;
        }
        .container{
            border: 0.3rem solid black;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }
        .box{
            height: 10rem;
            width: 10rem;
            flex-basis: 10rem;  
        }
        .box1{
            background-color: blue;
        }
        .box2{
            background-color: purple;
            flex-basis: 10rem;
        }
        .box3{
            background-color: burlywood;
        }
        .box3{
            background-color: cadetblue;
        }
        .box4{
            background-color: coral;
        }
        .box5{
            background-color: salmon;
        }
        .box6{
            background-color: darkblue;
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="box1 box">
            <p>box1</p>
        </div>
        <div class="box2 box">
            <p>box2</p>
        </div>
        <div class="box3 box">
            <p>box3</p>
        </div>
        <div class="box4 box">
            <p>box4</p>
        </div>
        <div class="box5 box">
            <p>box5</p>
        </div>
        <div class="box6 box">
            <p>box6</p>
        </div>
    </main>
</body>
</html>
