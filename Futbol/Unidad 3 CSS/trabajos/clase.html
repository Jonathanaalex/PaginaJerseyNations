<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clase</title>
    <style>
        .style1{
            color: red;
            font-family: 'Arial Narrow', Arial, sans-serif;
            font-size: small;
        }
        .style2{
            color: green;
            font-family: 'Arial Narrow', Arial, sans-serif;
            font-size: large;
            text-decoration: overline;
        }
        .style3{
            color: rgb(175, 200, 51);
            font-style: italic;
            font-size: 20px;
        }
        #titulo{
            color: rgb(202, 225, 25);
            font-size: 24px;
        }
        #Texto{
            color: rgb(0, 0, 255);
            font-style: oblique;
        }
    </style>
</head>
<body>
    <p class="style1"> Este es el estilo 1</p>
    <p class="style2"> Este es el estilo 2 y <strong class="style3"> este es el estilo 3</strong></p>
    <h1 id="titulo"> Soy un titulo grande</h1>
    <p id="Texto"> Soy otro texto</p>

    
</body>
</html>
