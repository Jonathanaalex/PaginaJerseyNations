<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Tienda de Playeras de Fútbol</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            text-align: center;
        }
        .product-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }
        .product {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            width: 200px;
            text-align: center;
            padding: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .product img {
            width: 100%;
            height: auto;
            border-bottom: 1px solid #ddd;
            margin-bottom: auto;
        }
        .product h3 {
            font-size: 18px;
            margin: 10px 0;
        }
        .product p {
            color: #555;
            font-size: 14px;
            margin: 5px 0;
        }
        .product button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .product button:hover {
            background-color: #218838;
        }
        .back-menu {
            display: block;
            margin: 20px auto;
            text-align: center;
            text-decoration: none;
            color: white;
            background-color: #007bff;
            padding: 10px 20px;
            border-radius: 5px;
            width: 150px;
        }
        .back-menu:hover {
            background-color: #0056b3;
        }
        @media (max-width: 600px) {
            .product-container {
                flex-direction: column;
                align-items: center;
            }
            .product {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Tienda de Playeras de Fútbol</h1>
    </header>
    <div class="product-container">
        <div class="product">
            <img src="https://static.nike.com/a/images/c_limit,w_592,f_auto/t_product_v1/3dbc7da1-ee2b-43b8-b1a9-0408ebd5f973/FCB+M+NK+DF+JSY+SS+STAD+HM.png" alt="Playera 1">
            <h3>Playera Equipo A</h3>
            <p>$25.00</p>
            <button>Comprar</button>
        </div>
        <div class="product">
            <img src="https://static.nike.com/a/images/c_limit,w_592,f_auto/t_product_v1/d82de8e7-97e2-4bb9-9f54-5e94345f2d5f/LFC+M+NK+DF+STRK+SS+TOP+K+SE.png" alt="Playera 2">
            <h3>Playera Equipo B</h3>
            <p>$30.00</p>
            <button>Comprar</button>
        </div>
        <div class="product">
            <img src="https://static.nike.com/a/images/c_limit,w_592,f_auto/t_product_v1/223a308b-913f-43f6-ad23-5eb2af529421/THFC+M+NK+DF+JSY+SS+STAD+HM.png" alt="Playera 3">
            <h3>Playera Equipo C</h3>
            <p>$28.00</p>
            <button>Comprar</button>
        </div>
        <div class="product">
            <img src="https://static.nike.com/a/images/c_limit,w_592,f_auto/t_product_v1/u_126ab356-44d8-4a06-89b4-fcdcc8df0245,c_scale,fl_relative,w_1.0,h_1.0,fl_layer_apply/585dfa6c-c3f6-49cc-9fbe-52eed67b5c28/PSG+M+NK+DF+JSY+SS+STAD+3R.png" alt="Playera 4">
            <h3>Playera Equipo D</h3>
            <p>$35.00</p>
            <button>Comprar</button>
        </div>
    </div>
    <a href="menu.html" class="back-menu">Regresar al Menú</a>
</body>
</html></div>
