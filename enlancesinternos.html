<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playas de México</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #content {
            margin-top: 20px;
        }
        .back-btn {
            margin-top: 20px;
            display: block;
            color: blue;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Playas de México</h1>
    <nav>
        <ul>
            <li><a href="#" onclick="showPlaya(1)">Playa 1: Akumal</a></li>
            <li><a href="#" onclick="showPlaya(2)">Playa 2: Sian Ka’an</a></li>
            <li><a href="#" onclick="showPlaya(3)">Playa 3: Isla Holbox</a></li>
        </ul>
    </nav>
    <div id="content">
        <p>Haz clic en una playa para ver su información.</p>
    </div>

    <script>
        // Información de cada playa
        const playas = {
            1: {
                titulo: "Playa 1: Akumal",
                descripcion: `
                    <strong>¿Adoras hacer snorkel y descubrir la vida del fondo marino?</strong>
                    La bahía de Akumal es un lugar fantástico para nadar con tres tipos diferentes de tortugas: verdes, carey y caguama.
                    Más allá de la impresionante fauna marina, es una playa con agua turquesa muy calmada perfecta para nadar.
                `
            },
            2: {
                titulo: "Playa 2: Sian Ka’an",
                descripcion: `
                    <strong>En los últimos años, Tulum se ha convertido en el destino de playa de moda en México.</strong>
                    Para encontrar las mejores playas, vale la pena salir de la principal zona turística y adentrarse en la Reserva de la Biosfera Sian Ka’an.
                    Hay prácticamente 50 kilómetros de playas casi vírgenes con agua de un color turquesa intenso.
                `
            },
            3: {
                titulo: "Playa 3: Isla Holbox",
                descripcion: `
                    <strong>Sin lugar a dudas, Holbox tiene algunas de las mejores playas de México para relajarse.</strong>
                    Esta isla al norte de la península de Yucatán es un auténtico paraíso tropical.
                    Sus playas tienen agua turquesa muy poco profunda y en algunas zonas se puede observar el increíble fenómeno del plancton luminiscente.
                `
            }
        };

        // Función para mostrar la información de cada playa
        function showPlaya(id) {
            const playa = playas[id];
            const contentDiv = document.getElementById('content');

            // Cambiar el contenido dinámicamente
            contentDiv.innerHTML = `
                <h2>${playa.titulo}</h2>
                <p>${playa.descripcion}</p>
                <span class="back-btn" onclick="goBack()">← Volver al menú principal</span>
            `;
        }

        // Función para volver al menú principal
        function goBack() {
            const contentDiv = document.getElementById('content');

            contentDiv.innerHTML = `
                <p>Haz clic en una playa para ver su información.</p>
            `;
        }
    </script>
</body>
</html>
